<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1612">
<title>Slide Remote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* Phone remote: one dark screen, two huge targets, the whole surface also takes swipes. */
  :root{
    --bg:#0b1612; --panel:#12231d; --line:#20372e; --fg:#eef4ef; --muted:#8fa69b; --gold:#e8b44a; --green:#3fb98a; --red:#f2786f;
    --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif; --body:"Figtree",ui-sans-serif,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--body);overscroll-behavior:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  [hidden]{display:none!important}
  .app{height:100%;display:flex;flex-direction:column;gap:14px;padding-block:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-bottom));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  header{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .logos{display:flex;gap:8px;align-items:center;background:#fff;border-radius:10px;padding:4px 8px}
  .logos img{height:30px;width:auto}
  h1{font-family:var(--display);font-weight:800;font-size:20px;margin:0}
  .status{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:8px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
  .status.on .dot{background:var(--green);box-shadow:0 0 0 4px rgba(63,185,138,.2)}
  .status.wait .dot{background:var(--gold)}
  .count{font-family:var(--display);font-weight:800;font-size:44px;text-align:center;color:var(--gold);font-variant-numeric:tabular-nums;min-height:52px}
  .pad{flex:1;display:grid;grid-template-columns:1fr 1.6fr;gap:12px;min-height:0}
  .pad button{border:1px solid var(--line);border-radius:22px;background:var(--panel);color:var(--fg);font-family:var(--display);font-weight:800;font-size:22px;display:grid;place-items:center;gap:6px;cursor:pointer;transition:transform .08s,background .15s}
  .pad button span{font-size:54px;line-height:1}
  .pad button small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted)}
  .pad #next{background:#14402f;border-color:#1f5a43}
  .pad button:active,.pad button.hit{transform:scale(.97);background:#1e5a43}
  .row{display:flex;gap:10px}
  .row button{flex:1;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:16px;font-weight:600;cursor:pointer}
  .row button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
  .hint{font-size:13px;color:var(--muted);text-align:center;margin:0}
  /* code entry */
  .join{flex:1;display:grid;align-content:center;gap:14px;text-align:center}
  .join input{font-family:var(--mono);font-size:30px;letter-spacing:.3em;text-transform:uppercase;text-align:center;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--panel);color:var(--fg);width:100%}
  .join button{padding:16px;border-radius:16px;border:0;background:var(--green);color:#06140e;font-size:18px;font-weight:700}
  .err{color:var(--red);font-size:14px;min-height:1.2em}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Slide Remote</h1>
      <div class="status" id="status"><span class="dot"></span><span id="statusTxt">Not connected</span></div>
    </div>
    <div class="logos"><img src="../assets/pssdc-logo.png" alt="PSSDC" onerror="var p=this.parentNode;this.remove();if(p&&!p.querySelector('img'))p.remove()"><img src="../assets/lagos-logo.png" alt="Lagos State Government" onerror="var p=this.parentNode;this.remove();if(p&&!p.querySelector('img'))p.remove()"></div>
  </header>

  <form class="join" id="join" hidden>
    <p class="hint" style="font-size:16px">Enter the code shown beside the QR code on the presenting laptop.</p>
    <input id="code" maxlength="6" autocomplete="off" autocapitalize="characters" inputmode="text" placeholder="CODE" aria-label="Remote code">
    <button type="submit">Connect</button>
    <div class="err" id="joinErr"></div>
  </form>

  <div id="remote" hidden style="display:contents">
    <div class="count" id="count"></div>
    <div class="pad" id="pad">
      <button id="prev" type="button"><span>◀</span>Back<small>or swipe right</small></button>
      <button id="next" type="button"><span>▶</span>Next<small>or swipe left</small></button>
    </div>
    <div class="row">
      <button id="blank" type="button" aria-pressed="false">Pause screen</button>
    </div>
    <p class="hint">Keep this page open. Your screen stays awake while it's showing.</p>
  </div>
</div>

<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const cfg = window.TAPIN_CONFIG || {};
  const sb = window.supabase && cfg.SUPABASE_URL ? window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY) : null;
  let channel = null, code = "", heardBack = false, blanked = false;

  function setStatus(kind, text) { $("status").className = "status " + kind; $("statusTxt").textContent = text; }
  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };

  function showJoin(msg) { $("join").hidden = false; $("remote").hidden = true; $("joinErr").textContent = msg || ""; setStatus("", "Not connected"); }
  $("join").addEventListener("submit", e => {
    e.preventDefault();
    const c = $("code").value.trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (c.length !== 6) return ($("joinErr").textContent = "The code has 6 letters and numbers.");
    location.hash = c; connect(c);
  });

  function connect(c) {
    if (!sb) return showJoin("Can't reach the service. Check the internet connection.");
    code = c;
    if (channel) sb.removeChannel(channel);
    $("join").hidden = true; $("remote").hidden = false;
    setStatus("wait", "Connecting… code " + code);
    heardBack = false;
    channel = sb.channel("remote-" + code, { config: { broadcast: { self: false } } });
    channel.on("broadcast", { event: "state" }, ({ payload }) => {
      heardBack = true;
      setStatus("on", "Connected · code " + code);
      if (payload && payload.total) $("count").textContent = `${payload.page} / ${payload.total}`;
      if (payload && typeof payload.blank === "boolean") { blanked = payload.blank; $("blank").setAttribute("aria-pressed", blanked); $("blank").textContent = blanked ? "Show slide" : "Pause screen"; }
    });
    channel.subscribe(status => {
      if (status === "SUBSCRIBED") {
        send("hello");
        setTimeout(() => { if (!heardBack) setStatus("wait", "Waiting for the slides… open Air Swipe on the laptop"); }, 3000);
      } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") setStatus("", "Connection lost. Retrying…");
    });
    keepAwake();
  }

  function send(cmd) {
    if (!channel) return;
    channel.send({ type: "broadcast", event: "cmd", payload: { cmd } });
  }
  function press(cmd, el) {
    send(cmd); buzz(cmd === "blank" ? [20, 40, 20] : 25);
    if (el) { el.classList.add("hit"); setTimeout(() => el.classList.remove("hit"), 150); }
  }
  $("next").addEventListener("click", () => press("next", $("next")));
  $("prev").addEventListener("click", () => press("prev", $("prev")));
  $("blank").addEventListener("click", () => press("blank", $("blank")));

  // Swipe anywhere: left = next (like turning a page), right = back.
  let sx = 0, sy = 0, st = 0;
  document.addEventListener("touchstart", e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); }, { passive: true });
  document.addEventListener("touchend", e => {
    if ($("remote").hidden) return;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Date.now() - st < 600 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      e.preventDefault?.();
      press(dx < 0 ? "next" : "prev", dx < 0 ? $("next") : $("prev"));
    }
  });
  // Keyboard and clicker keys too (a Bluetooth keyboard or presenter clicker paired with the phone).
  document.addEventListener("keydown", e => {
    if ($("remote").hidden) return;
    if (["ArrowRight", "PageDown", " ", "ArrowDown"].includes(e.key)) { e.preventDefault(); press("next", $("next")); }
    if (["ArrowLeft", "PageUp", "ArrowUp"].includes(e.key)) { e.preventDefault(); press("prev", $("prev")); }
    if (e.key === "b" || e.key === "B" || e.key === ".") press("blank", $("blank"));
  });

  let wakeLock = null;
  async function keepAwake() { try { if (!wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => (wakeLock = null)); } } catch {} }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && code) { keepAwake(); send("hello"); } });

  const fromHash = location.hash.replace("#", "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (fromHash.length === 6) connect(fromHash); else showJoin();
})();
</script>
</body>
</html>
